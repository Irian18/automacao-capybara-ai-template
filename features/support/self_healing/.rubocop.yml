# RuboCop local para o módulo SelfHealing.
# Herda as regras do projeto, mas ajusta métricas para código de agente ReAct.

AllCops:
  NewCops: enable
  SuggestExtensions: false

Layout/EndOfLine:
  EnforcedStyle: lf

Metrics/ClassLength:
  Max: 200

Metrics/MethodLength:
  Max: 20

Metrics/BlockLength:
  Max: 30
  Exclude:
    - 'spec/**/*'

Metrics/AbcSize:
  Max: 35

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Metrics/ParameterLists:
  Max: 7

Style/Documentation:
  Enabled: false

Lint/MissingSuper:
  Enabled: false
