# SelfHealing — Design System Configuration Example
# Copie este arquivo para config/design_system.yml e adapte ao seu projeto.

# Seletores considerados interativos para snapshots.
# Use apenas seletores estáveis (data-test-id, tags HTML nativas, roles ARIA).
interactive_selectors:
  - 'a'
  - 'button'
  - 'input'
  - 'select'
  - 'textarea'
  - '[role="button"]'
  - '[role="link"]'
  - '[data-testid]'
  - '[data-test-id]'

# Componentes customizados que devem ser tratados como campos de formulário.
# Cada entrada pode definir um kind e seletores auxiliares.
# Use #{value} como placeholder para o valor do atributo identificador.
field_components:
  # Exemplo para um select-box customizado:
  # select-box:
  #   kind: select
  #   identifier: inputid
  #   open_selector: '##{value}SelectBox'
  #   options_selector: '##{value}Options'

# Tags ou seletores de componentes que devem ser mapeados como seções.
section_components:
  - 'table'
  - 'modal'
  - 'dialog'
  - 'alert'

# Tags a serem ignoradas durante a análise de HTML.
ignore_tags:
  - 'script'
  - 'style'
  - 'meta'
  - 'link'
  - 'noscript'
  - 'template'

# Padrões regex (como strings) para identificar IDs instáveis ou gerados.
unstable_id_patterns:
  - '\Acdk-'
  - '\Amat-'
  - '\Ack-'
  - '\Aswal2-'
  - '\A[a-z0-9]{20,}\z'
  - '-\d{6,}\z'
  - '\Aoption-\d+'
  - '\Amodal-[a-f0-9]+'
  - '\Adropdown-\d+'

# Prefixos de classe/atributo considerados ruído do framework.
noisy_class_prefixes:
  - 'ng-tns-'
  - 'ng-trigger-'
  - 'cdk-'
  - 'mat-'

noisy_attr_prefixes:
  - '_ngcontent-'
  - '_nghost-'

# Classes Angular geradas que devem ser ignoradas na descrição de elementos.
generated_classes:
  - 'ng-untouched'
  - 'ng-touched'
  - 'ng-pristine'
  - 'ng-dirty'
  - 'ng-valid'
  - 'ng-invalid'
  - 'ng-pending'
  - 'ng-star-inserted'
