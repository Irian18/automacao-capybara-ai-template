---
default: --publish-quiet --color -t "not @wip" -p pretty -p example -p allure -p routes_name -p cuprite -p rag -p self_healing

# Formatação
pretty: --format pretty
for_ci: --format progress

# Browsers
cuprite: BROWSER=cuprite

# Ambientes de teste
example: ENVIRONMENT_TYPE=example
ci: ENVIRONMENT_TYPE=ci
prod: ENVIRONMENT_TYPE=prod
local: ENVIRONMENT_TYPE=local
staging: ENVIRONMENT_TYPE=staging
sandbox: ENVIRONMENT_TYPE=sandbox
prod_automacao_ci: ENVIRONMENT_TYPE=prod_automacao_ci

# RAG
rag: RAG_ENABLED=true RAG_TOP_K=3 RAG_MIN_SIMILARITY=0.0 RAG_KNOWLEDGE_BASE_DIR=features/pages,features/support/self_healing/knowledge_base
no_rag: RAG_ENABLED=false

# Self Healing
self_healing: SELF_HEALING_ENABLED=true --exclude "features/support/self_healing/spec"
no_self_healing: SELF_HEALING_ENABLED=false --exclude "features/support/self_healing/spec"
AI_FORCE_RECORD: true

# Relatórios
html: --format html --out=report/html_report/report.html
allure: --format AllureCucumber::CucumberFormatter --out report/allure_results
json: --format json --out=report/json_report/report.json

routes_name: ROUTES_NAME=features/config/routes_by_name.yml
